services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: deps
    container_name: hrm-frontend-dev
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
